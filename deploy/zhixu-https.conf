# HTTPS entrance for Zhixu only. The shared IP certificate is renewed by gaoqiu-certbot.timer.
server {
    listen 3063 ssl;
    server_name 154.40.47.111;
    ssl_certificate /etc/letsencrypt/live/gaoqiu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaoqiu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZhixuTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 18m;
    server_tokens off;
    access_log /www/wwwlogs/zhixu-https-access.log;
    error_log /www/wwwlogs/zhixu-https-error.log;

    # Replace the previous application policy until the matching app release is deployed.
    proxy_hide_header Permissions-Policy;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /_next/static/ {
        alias /www/wwwroot/xuexi/.static-archive/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # The realtime voice service authenticates the WebSocket and listens only on loopback.
    # Keep this port independent of the 3061/3062 web release switch.
    location = /api/voice/live {
        proxy_pass http://127.0.0.1:3064;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }
}
