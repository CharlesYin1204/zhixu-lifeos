server {
    listen 3060;
    server_name 154.40.47.111;
    client_max_body_size 300k;
    server_tokens off;
    access_log /www/wwwlogs/zhixu-access.log;
    error_log /www/wwwlogs/zhixu-error.log;
    # Keep immutable assets from previous releases available to already-open pages.
    location ^~ /_next/static/ {
        alias /www/wwwroot/xuexi/.static-archive/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/media {
        client_max_body_size 18m;
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }
}
